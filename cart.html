<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electro Cart</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:#f5f5f5;}
header{display:flex;align-items:center;justify-content:space-between;padding:15px 5%;background:white;flex-wrap:wrap;gap:15px;}
.logo{font-size:28px;font-weight:700;color:#ff6600;}
.search{flex:1;display:flex;max-width:500px;border:1px solid #ddd;border-radius:30px;overflow:hidden;}
.search input{flex:1;padding:10px;border:none;outline:none;}
.search button{background:#ff8800;border:none;padding:10px 20px;color:white;cursor:pointer;}
.icons{display:flex;align-items:center;gap:20px;}
.icons a{text-decoration:none;color:black;font-size:20px;}
.profile{position:relative;cursor:pointer;font-size:20px;}
.profile-dropdown{display:none;position:absolute;right:0;top:35px;background:white;box-shadow:0 5px 15px rgba(0,0,0,0.1);border-radius:6px;min-width:160px;overflow:hidden;z-index:1000;}
.profile-dropdown a{display:block;padding:10px;color:#333;text-decoration:none;}
nav{display:flex;align-items:center;justify-content:space-between;background:#ff8800;padding:10px 5%;}
#menu{display:flex;align-items:center;gap:25px;list-style:none;}
#menu li a{text-decoration:none;color:black;font-weight:600;}
#menu li a:hover{color:white;}
.call-btn{background:#ff6600;border:none;padding:8px 18px;color:white;border-radius:20px;cursor:pointer;}
.cart-container{max-width:1000px;margin:40px auto;padding:20px;}
.product-card{display:flex;align-items:center;justify-content:space-between;background:white;margin-bottom:20px;padding:15px;border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,0.1);}
.product-left{display:flex;align-items:center;gap:15px;}
.product-left img{width:100px;height:100px;object-fit:cover;border-radius:10px;}
.product-info h3{margin:0;}
.price{font-weight:bold;color:#ff6600;margin-top:5px;}
.rating{color:gold;margin-top:4px;font-size:14px;}
.product-actions{display:flex;align-items:center;gap:8px;}
.buy-btn{padding:8px 16px;background:#222;color:white;border:none;border-radius:5px;cursor:pointer;}
.remove-btn{padding:8px 16px;background:red;color:white;border:none;border-radius:5px;cursor:pointer;}
.summary{text-align:right;margin-top:20px;font-size:20px;font-weight:600;}

/* MODAL */
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);justify-content:center;align-items:center;z-index:999;}
.modal-content{background:white;border-radius:10px;width:90%;max-width:600px;max-height:90%;overflow-y:auto;position:relative;padding:20px;animation:fadeIn 0.3s ease;}
.modal-content img{width:200px;height:150px;object-fit:cover;border-radius:10px;margin-bottom:15px;}
.close-btn{position:absolute;top:10px;right:15px;font-size:20px;cursor:pointer;color:#ff6600;}
@keyframes fadeIn{from {opacity:0; transform:translateY(-20px);} to {opacity:1; transform:translateY(0);}}
.help-modal{
  position:fixed;
  top:0; left:0; right:0; bottom:0;
  background:rgba(0,0,0,0.6);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:10000;
}
.help-content{
  background:white;
  padding:20px;
  max-width:400px;
  width:80%;
  border-radius:8px;
  text-align:center;
  position:relative;
}
.help-content .close-btn{
  position:absolute;
  top:10px; right:15px;
  font-size:24px;
  cursor:pointer;
}
</style>
</head>
<body>

<header>
<div class="logo">👜 Electro</div>
<div class="search">
<input type="text" placeholder="Search Looking For?">
<button>🔍</button>
</div>
<div class="icons">
<a href="cart.html">🛒</a>
<div class="profile">
<span onclick="toggleDropdown()">👤</span>
<div class="profile-dropdown" id="profileDropdown">
<a id="welcomeUser"></a>
<a href="profile.html">My Profile</a>
<a href="#" onclick="logout()">Logout</a>
</div>
</div>
</div>
</header>

<nav>
<div><span id="showUser"></span></div>
<ul id="menu">
<li><a href="home.html">Home</a></li>
<li><a href="offers.html">Categories</a></li>
<li><a href="pd.html">Products</a></li>
<li><a href="orders.html">My Orders</a></li>
<li><a href="#" onclick="openHelp()">Help/Contact</a></li>
<li><button class="call-btn">+0123 456 7890</button></li>
</ul>
</nav>

<div class="cart-container">
<h2>Your Cart</h2>
<div id="cartItems"></div>
<div class="summary">
Total Items: <span id="totalItems">0</span> | Total Amount: ₹<span id="totalAmount">0</span>
</div>
</div>

<!-- MODAL -->
<div class="modal" id="modalCard">
<div class="modal-content" id="modalContent">
<span class="close-btn" onclick="closeModal()">&times;</span>
</div>
</div>

<script>
// ======= USER DISPLAY =======
let user = localStorage.getItem("userName");
let isLoggedIn = localStorage.getItem("isLoggedIn")==="true";
document.getElementById("showUser").innerText = isLoggedIn && user ? user : "Guest";
document.getElementById("welcomeUser").innerText = isLoggedIn && user ? "Welcome, "+user : "";

// ======= LOGOUT =======
function logout(){
localStorage.removeItem("isLoggedIn");
localStorage.removeItem("userName");
window.location.href="login.html";
}

// ======= TOGGLE PROFILE DROPDOWN =======
function toggleDropdown(){
let d=document.getElementById("profileDropdown");
d.style.display = d.style.display==="block" ? "none" : "block";
}
window.addEventListener("click", e=>{
if(!e.target.closest(".profile")) document.getElementById("profileDropdown").style.display="none";
});

// ======= CART SYSTEM =======
let cart = JSON.parse(localStorage.getItem("cart")) || {}; // {productName: qty}
const USD_TO_INR = 82; // conversion rate
// product list should match other pages so items added anywhere render correctly
const products = [
  {name:"MacBook Pro 14", price:1999, img:"l1.jpeg", category:"laptop", brand:"Apple", details:"M2 chip, 14-inch Retina"},
  {name:"MacBook Air", price:1499, img:"l2.jpeg", category:"laptop", brand:"Apple", details:"M2 chip, 13-inch"},
  {name:"Dell XPS 15", price:1899, img:"l3.jpeg", category:"laptop", brand:"Dell", details:"Intel i7, 15-inch"},
  {name:"Dell Inspiron 16", price:1299, img:"l4.jpeg", category:"laptop", brand:"Dell", details:"Intel i5, 16-inch"},
  {name:"HP Spectre x360", price:1599, img:"l5.jpeg", category:"laptop", brand:"HP", details:"Convertible touch"},
  {name:"HP Envy 15", price:1399, img:"l6.jpeg", category:"laptop", brand:"HP", details:"Dedicated GPU"},
  {name:"Lenovo ThinkPad X1", price:1799, img:"l7.jpeg", category:"laptop", brand:"Lenovo", details:"Business class"},
  {name:"Lenovo IdeaPad 5", price:1099, img:"l8.jpeg", category:"laptop", brand:"Lenovo", details:"Budget friendly"},
  {name:"ASUS ROG Zephyrus", price:2199, img:"l9.jpeg", category:"laptop", brand:"ASUS", details:"Gaming powerhouse"},
  {name:"ASUS ZenBook 14", price:1899, img:"l10.jpeg", category:"laptop", brand:"ASUS", details:"Slim design"},

  {name:"iPhone 15 Pro", price:999, img:"p1.jpeg", category:"mobile", brand:"Apple", details:"A17 chip, Pro cameras"},
  {name:"iPhone 15", price:899, img:"p2.jpeg", category:"mobile", brand:"Apple", details:"A16 chip"},
  {name:"Samsung Galaxy S24", price:899, img:"p3.jpeg", category:"mobile", brand:"Samsung", details:"Snapdragon 8 Gen 3"},
  {name:"Samsung Galaxy S24+", price:999, img:"p4.jpeg", category:"mobile", brand:"Samsung", details:"6.7-inch display"},
  {name:"Google Pixel 8", price:799, img:"p5.jpeg", category:"mobile", brand:"Google", details:"Tensor G3"},
  {name:"Google Pixel 8 Pro", price:899, img:"p6.jpeg", category:"mobile", brand:"Google", details:"Pro grade camera"},
  {name:"OnePlus 12", price:749, img:"p7.jpeg", category:"mobile", brand:"OnePlus", details:"Fast charging"},
  {name:"OnePlus 12 Pro", price:849, img:"p8.jpeg", category:"mobile", brand:"OnePlus", details:"120Hz AMOLED"},
  {name:"Xiaomi 14", price:699, img:"p9.jpeg", category:"mobile", brand:"Xiaomi", details:"Android 14"},
  {name:"Xiaomi 14 Pro", price:799, img:"p10.jpeg", category:"mobile", brand:"Xiaomi", details:"120W charging"},

  {name:"Apple Watch Series 9", price:399, img:"sw1.jpeg", category:"watch", brand:"Apple", details:"Always on display"},
  {name:"Apple Watch SE", price:249, img:"sw2.jpeg", category:"watch", brand:"Apple", details:"Affordable"},
  {name:"Samsung Galaxy Watch 6", price:349, img:"sw3.jpeg", category:"watch", brand:"Samsung", details:"BioActive sensor"},
  {name:"Samsung Galaxy Watch 5", price:299, img:"sw4.jpeg", category:"watch", brand:"Samsung", details:"Durable"},
  {name:"Fitbit Versa 4", price:229, img:"sw5.jpeg", category:"watch", brand:"Fitbit", details:"Fitness focussed"},
  {name:"Fitbit Sense 2", price:299, img:"sw6.jpeg", category:"watch", brand:"Fitbit", details:"Health features"},
  {name:"Garmin Venu 2", price:349, img:"sw7.jpeg", category:"watch", brand:"Garmin", details:"GPS tracking"},
  {name:"Garmin Fenix 7", price:499, img:"sw8.jpeg", category:"watch", brand:"Garmin", details:"Rugged"},
  {name:"Google Pixel Watch 2", price:299, img:"sw9.jpeg", category:"watch", brand:"Google", details:"Sleek"},
  {name:"Google Pixel Watch 1", price:249, img:"sw10.jpeg", category:"watch", brand:"Google", details:"Affordable"},

  {name:"AirPods Pro 2", price:249, img:"g1.jpeg", category:"gadget", brand:"Apple", details:"Noise cancellation"},
  {name:"Magic Keyboard", price:99, img:"g2.jpeg", category:"gadget", brand:"Apple", details:"Wireless"},
  {name:"Apple Pencil 2", price:129, img:"g3.jpeg", category:"gadget", brand:"Apple", details:"Stylus"},
  {name:"Logitech MX Master 3 Mouse", price:99, img:"g4.jpeg", category:"gadget", brand:"Logitech", details:"Ergonomic"},
  {name:"Logitech K380 Keyboard", price:49, img:"g5.jpeg", category:"gadget", brand:"Logitech", details:"Compact"},
  {name:"Sony WF-1000XM5", price:299, img:"g6.jpeg", category:"gadget", brand:"Sony", details:"Hi-res audio"},
  {name:"Sony SRS-XB43 Speaker", price:199, img:"g7.jpeg", category:"gadget", brand:"Sony", details:"Extra bass"},
  {name:"Samsung Galaxy Buds2 Pro", price:229, img:"G62.jpeg", category:"gadget", brand:"Samsung", details:"3D audio"},
  {name:"Samsung SmartTag+", price:29, img:"g9.jpeg", category:"gadget", brand:"Samsung", details:"Tracking"},
  {name:"Samsung Wireless Charger Duo", price:59, img:"g10.jpeg", category:"gadget", brand:"Samsung", details:"Fast charge"}
];

// ======= CART FUNCTIONS =======
function renderCart(){
let container=document.getElementById("cartItems");
container.innerHTML="";
let totalItems=0, totalAmount=0;

for(let productName in cart){
  let qty = cart[productName];
  let product = products.find(p=>p.name===productName);
  if(!product) continue; // skip if not found
  totalItems += qty;
  totalAmount += product.price * qty * USD_TO_INR;

container.innerHTML+=`
<div class="product-card">
<div class="product-left">
<img src="${product.img}">
<div class="product-info">
<h3>${product.name}</h3>
<div class="price">₹${(product.price * USD_TO_INR).toFixed(2)}</div>
<div class="rating">⭐⭐⭐⭐☆</div>
</div>
</div>
<div class="product-actions">
<button class="buy-btn" onclick="openBuyNow('${product.name}')">Buy Now</button>
<button class="buy-btn" onclick="increaseItem('${product.name}')">+</button>
<button class="buy-btn">${qty}</button>
<button class="buy-btn" onclick="decreaseItem('${product.name}')">-</button>
<button class="remove-btn" onclick="removeItem('${product.name}')">Remove</button>
</div>
</div>`;}
document.getElementById("totalItems").innerText = totalItems;
// show rupees with two decimal places
document.getElementById("totalAmount").innerText = totalAmount.toFixed(2);
localStorage.setItem("cart", JSON.stringify(cart));
}

function increaseItem(name){cart[name]++; renderCart();}
function decreaseItem(name){cart[name]--; if(cart[name]<=0) delete cart[name]; renderCart();}
function removeItem(name){delete cart[name]; renderCart();}

// ======= BUY NOW MODAL =======
let modal = document.getElementById("modalCard");
let modalContent = document.getElementById("modalContent");

function openBuyNow(name){
  let product = products.find(p=>p.name===name);
  if(!product) return;
  modalContent.innerHTML = `
<span class="close-btn" onclick="closeModal()">&times;</span>
<img src="${product.img}">
<h3>${product.name}</h3>
<p>Price: ₹${(product.price * USD_TO_INR).toFixed(2)}</p>
<p>${product.details}</p>
<button class="buy-btn" onclick="placeOrder('${product.name}')">Place Order</button>
`;
  modal.style.display="flex";
}

function closeModal(){modal.style.display="none";}

function placeOrder(name){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      pos=>{
        const loc = pos.coords.latitude.toFixed(6) + "," + pos.coords.longitude.toFixed(6);
        saveCartOrder(name, loc);
      },
      err=>{
        console.warn('location error',err);
        saveCartOrder(name, null);
      },
      {enableHighAccuracy:true, timeout:10000}
    );
  } else {
    saveCartOrder(name, null);
  }
}

function saveCartOrder(name, location){
  let product = products.find(p=>p.name===name);
  let orders = JSON.parse(localStorage.getItem("orders")) || [];
  orders.push({name:product.name, price:(product.price * USD_TO_INR).toFixed(2), img:product.img, quantity:cart[name], status:"Pending", details:product.details, location: location || 'unknown'});
  localStorage.setItem("orders", JSON.stringify(orders));
  delete cart[name]; renderCart(); closeModal();
  let msg = "Order Placed Successfully!";
  if(location) msg += "\nLocation: " + location;
  alert(msg);
}

// HELP modal handlers
function openHelp(){document.getElementById('helpModal').style.display='flex';}
function closeHelp(){document.getElementById('helpModal').style.display='none';}
document.addEventListener('click',e=>{if(e.target.id==='helpModal')closeHelp();});

// ======= INIT =======
if(Array.isArray(cart)){
let newCart={};
cart.forEach(i=>newCart[i]=(newCart[i]||0)+1);
cart=newCart;
renderCart();
}else{renderCart();}
</script>

<!-- HELP/CONTACT MODAL -->
<div class="help-modal" id="helpModal">
  <div class="help-content">
    <span class="close-btn" onclick="closeHelp()">&times;</span>
    <h2>Help & Contact</h2>
    <p>Call us: 1800-123-4567</p>
    <p>Email: support@electro.com</p>
    <p>Chat with us 24×7</p>
    <p>FAQ: <a href="faq.html">Visit FAQ</a></p>
  </div>
</div>

</body>
</html>
