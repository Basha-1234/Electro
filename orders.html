<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Electro - My Orders</title>

<style>
body{
  margin:0;
  font-family:Poppins, sans-serif;
  background:#f5f5f5;
}
/* theme variables */
:root{
  --primary-color:#ff6600;
  --secondary-color:#ff8800;
  --bg-light:#f5f5f5;
  --text-dark:#333;
  --btn-bg:#000;
  --btn-text:#fff;
}
/* apply theme */
header, nav{background:var(--secondary-color);} 
.logo{color:var(--primary-color);} 
.buy-btn{background:var(--btn-bg);color:var(--btn-text);text-decoration:none;display:inline-block;} 
.add-btn, .call-btn{background:var(--primary-color);} 
.search button{background:var(--secondary-color);} 
.modal-content{border:2px solid var(--primary-color);} 
.close-btn{color:var(--primary-color);}

/* HEADER */
header{

display:flex;

align-items:center;

justify-content:space-between;

padding:15px 5%;

background:white;

flex-wrap:wrap;

gap:15px;

}

.logo{

font-size:28px;

font-weight:700;

color:#ff6600;

}

.search{

flex:1;

display:flex;

max-width:600px;

border:1px solid #ddd;

border-radius:30px;

overflow:hidden;

background:white;

}

.search input{

flex:1;

padding:10px;

border:none;

outline:none;

}

.search button{

background:#ff8800;

border:none;

padding:10px 20px;

color:white;

cursor:pointer;

}

.icons{

display:flex;

align-items:center;

gap:20px;

font-size:18px;

}

.cart{

position:relative;

cursor:pointer;

}

.cart-count{

position:absolute;

top:-8px;

right:-10px;

background:red;

color:white;

border-radius:50%;

font-size:12px;

padding:2px 6px;

display:none;

}

.profile{position:relative; cursor:pointer;}

.profile-dropdown{

  display:none;

  position:absolute;

  right:0;

  top:30px;

  background:white;

  box-shadow:0 5px 15px rgba(0,0,0,0.1);

  border-radius:6px;

  min-width:140px;

  overflow:hidden;

  z-index:1000;

}

.profile-dropdown a{display:block; padding:10px; color:#333; text-decoration:none;}

.profile-dropdown a:hover{background:#f5f5f5;}

/* PROFILE */
.profile{
  position:relative;
  cursor:pointer;
}

.profile-dropdown{
  display:none;
  position:absolute;
  right:0;
  top:30px;
  background:white;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
  border-radius:6px;
  min-width:150px;
  overflow:hidden;
}

.profile-dropdown a{
  display:block;
  padding:10px;
  color:#333;
  text-decoration:none;
}

.profile-dropdown a:hover{
  background:#f5f5f5;
}

/* NAVBAR */
nav{

display:flex;

align-items:center;

justify-content:space-between;

background:#ff8800;

padding:10px 5%;

}

#menu{

display:flex;

align-items:center;

gap:25px;

list-style:none;

margin:0;

padding:0;

}

#menu li a{

text-decoration:none;

color:black;

font-weight:600;

}

#menu li a:hover{

color:#ffffff;

}

.call-btn{

background:#ff6600;

border:none;

padding:8px 18px;

color:white;

border-radius:20px;

cursor:pointer;

}

#showUser{

color:black;

font-weight:600;

}

/* ORDERS */
.orders{
  max-width:900px;
  margin:40px auto;
  background:white;
  padding:20px;
  border-radius:10px;
  box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.orders h2{
  margin-bottom:20px;
}

.order-card{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #eee;
  padding:15px 0;
  flex-wrap:wrap;
  gap:10px;
  cursor:pointer;
  transition:0.2s;
}

.order-card:hover{
  background:#f9f9f9;
}

.order-info{
  display:flex;
  gap:15px;
  align-items:center;
}

.order-info img{
  width:100px;
  height:100px;
  object-fit:cover;
  border-radius:10px;
}

.status{
  padding:5px 12px;
  border-radius:20px;
  font-size:13px;
}

.delivered{ background:#d4edda; color:#155724; }
.pending{ background:#fff3cd; color:#856404; }
.cancelled{ background:#f8d7da; color:#721c24; }

/* MODAL CARD */
.modal{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  justify-content:center;
  align-items:center;
  z-index:999;
}

.modal-content{
  background:white;
  border-radius:10px;
  width:90%;
  max-width:500px;
  max-height:90%;
  overflow-y:auto;
  position:relative;
  padding:20px;
  animation:fadeIn 0.3s ease;
  text-align:center; /* align modal text centrally */
}
/* layout for pending order details */
.pending-container{
  display:flex;
  align-items:flex-start;
  gap:20px;
  text-align:left;
}
.pending-container .tracking{
  flex:1;
}
.pending-container .details{
  flex:2;
}

.modal-content img{
  width:100%;
  height:auto;
  border-radius:10px;
  margin-bottom:15px;
}

.modal-content h3{
  margin:10px 0;
}

.modal-content p{
  margin:5px 0;
  line-height:1.4;
}

.close-btn{
  position:absolute;
  top:10px;
  right:15px;
  font-size:20px;
  cursor:pointer;
  color:#ff6600;
}

@keyframes fadeIn{
  from {opacity:0; transform:translateY(-20px);}
  to {opacity:1; transform:translateY(0);}
}

@media(max-width:600px){
  .order-card{
    flex-direction:column;
    align-items:flex-start;
  }
}
.help-modal{
  position:fixed;
  top:0; left:0; right:0; bottom:0;
  background:rgba(0,0,0,0.6);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:10000;
}
.help-content{
  background:white;
  padding:20px;
  max-width:400px;
  width:80%;
  border-radius:8px;
  text-align:center;
  position:relative;
}
.help-content .close-btn{
  position:absolute;
  top:10px; right:15px;
  font-size:24px;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- HEADER -->
<header>
  <div class="logo">👜 Electro</div>

  <div class="icons">
    <div class="cart" onclick="goCart()">
      🛒
      <span id="cartCount" class="cart-count"></span>
    </div>
    <div class="profile">
      <span onclick="toggleDropdown()">👤</span>
      <div class="profile-dropdown" id="profileDropdown">
        <a href="profile.html">My Profile</a>
        <a href="#" onclick="logout()">Logout</a>
      </div>
    </div>
  </div>
</header>

<!-- NAVBAR -->
<nav>
<div><span id="showUser"></span></div>
<ul id="menu">
<li><a href="home.html">Home</a></li>
<li><a href="offers.html">Offers</a></li>
<li><a href="pd.html">Products</a></li>
<li><a href="orders.html">My Orders</a></li>
<li><a href="#" onclick="openHelp()">Help/Contact</a></li>
<li><button class="call-btn">+0123 456 7890</button></li>
</ul>
</nav>

<!-- ORDERS -->
<div class="orders">
<h2>My Orders</h2>
<div id="orderList"></div>
</div>

<!-- MODAL CARD -->
<div class="modal" id="modalCard">
<div class="modal-content" id="modalContent">
<span class="close-btn" onclick="closeModal()">&times;</span>
</div>
</div>

<script>
// Orders storage helpers
function getOrders(){
  let o = localStorage.getItem("orders");
  if(!o) return [];
  try{ o = JSON.parse(o); if(!Array.isArray(o)) return []; return o; }catch(e){ return []; }
}
function saveOrders(arr){ localStorage.setItem("orders", JSON.stringify(arr)); }

// load orders, fallback to sample if empty
let orders = getOrders();
if(orders.length === 0){
  orders = [
    {name:"Laptop Pro", price:899, img:"l6.jpeg", status:"Delivered", details:"High performance gaming laptop."},
    {name:"Smart Watch", price:149, img:"sw6.jpeg", status:"Pending", details:"Track your daily activity."},
    {name:"Xiaomi Mobile", price:399, img:"p9.jpeg", status:"Delivered", details:"Budget performer"},
    {name:"Ear buds", price:79, img:"g2.jpeg", status:"Cancelled", details:"Wireless earbuds with bass."},
    {name:"Headphones", price:129, img:"g5.jpeg", status:"Pending", details:"Over-ear noise-canceling headphones."},
    {name:"Xiaomi", price:399, img:"p10.jpeg", status:"Delivered", details:"Lightweight and fast mobile."}
  ];
  saveOrders(orders);
}

const USD_TO_INR = 82; // used to convert legacy USD prices

// utility for sorting and rendering
function sortOrders(){
  orders.sort((a,b)=>{
    if(a.status === "Pending" && b.status !== "Pending") return -1;
    if(a.status !== "Pending" && b.status === "Pending") return 1;
    return 0;
  });
}

// render orders list
let list = document.getElementById("orderList");
function renderOrders(){
  sortOrders();
  list.innerHTML = "";
  orders.forEach((o,i)=>{
    let statusClass = o.status.toLowerCase();
    // if price seems like USD (under 1000) convert
    let displayPrice = o.price;
    if(typeof displayPrice === 'number' && displayPrice < 1000){
      displayPrice = (displayPrice * USD_TO_INR).toFixed(2);
    }
    list.innerHTML += `
      <div class="order-card" onclick="openModal(${i})">
        <div class="order-info">
          <img src="${o.img}">
          <div>
            <b>${o.name}</b><br>
            ₹${displayPrice}
          </div>
        </div>
        <div class="status ${statusClass}">
          ${o.status}
        </div>
      </div>
    `;
  });
}

// initial render
renderOrders();

// HELP modal handlers
function openHelp(){document.getElementById('helpModal').style.display='flex';}
function closeHelp(){document.getElementById('helpModal').style.display='none';}
document.addEventListener('click',e=>{if(e.target.id==='helpModal')closeHelp();});

// USER
function loadUser(){
  let userName = localStorage.getItem("userName");
  document.getElementById("showUser").innerText = userName ? "Hi, "+userName : "";
  document.getElementById("welcomeUser").innerText = userName ? "Hi, "+userName : "";
}

// CART COUNT
function updateCartCount(){
  let cartRaw = localStorage.getItem("cart");
  let count = 0;
  if(cartRaw){
    try{
      let cart = JSON.parse(cartRaw);
      if(Array.isArray(cart)){
        // old format
        count = cart.length;
      } else if(typeof cart === 'object' && cart !== null){
        for(let k in cart){
          let v = cart[k];
          if(typeof v === 'number') count += v;
          else if(v && v.qty) count += v.qty;
        }
      }
    }catch(e){ }
  }
  let badge = document.getElementById("cartCount");
  if(badge){
    if(count>0){ badge.innerText = count; badge.style.display="inline-block"; }
    else badge.style.display="none";
  }
}

function goCart(){ window.location="cart.html"; }

loadUser();
updateCartCount();

// PROFILE
function toggleDropdown(){
  let d = document.getElementById("profileDropdown");
  d.style.display = d.style.display==="block"?"none":"block";
}

function logout(){
  localStorage.removeItem("isLoggedIn");
  localStorage.removeItem("userName");
  window.location.href="login.html";
}

window.addEventListener("click", e=>{
  if(!e.target.closest(".profile")){
    document.getElementById("profileDropdown").style.display="none";
  }
});

// MODAL FUNCTION
function openModal(index){
  let order = orders[index];
  let modal = document.getElementById("modalCard");
  let content = document.getElementById("modalContent");

  if(order.status==="Pending"){
    content.innerHTML = `
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <img src="${order.img}">
      <h3>${order.name}</h3>
      <div class="pending-container">
        <div class="tracking">
          <h4>Tracking:</h4>
          <p>Order Placed ✅</p>
          <p>Processing ✅</p>
          <p>Shipped ⏳</p>
          <p>Out for Delivery ⏳</p>
        </div>
        <div class="details">
          <p>Status: <b>${order.status}</b></p>
          <p>${order.details}</p>
          <p>Location: <b>${order.location || 'unknown'}</b></p>
        </div>
      </div>
      <button onclick="cancelOrder(${index})" style="margin-top:15px; background:red; color:white; padding:8px 16px; border:none; border-radius:5px; cursor:pointer;">Cancel Order</button>
    `;
  } else if(order.status==="Cancelled"){
    content.innerHTML = `
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h3 style="text-align:center; color:red;">❌ Sorry, Your Order is Cancelled ❌</h3>
      <img src="${order.img}">
      <p style="text-align:center;">We apologize for the inconvenience.</p>
      <button onclick="deleteOrder(${index})" style="margin-top:15px; background:#555; color:white; padding:8px 16px; border:none; border-radius:5px; cursor:pointer;">Delete Order</button>
    `;
  } else if(order.status==="Delivered"){
    content.innerHTML = `
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h3 style="text-align:center; color:green;">🎉 Delivered Successfully! 🎉</h3>
      <img src="${order.img}">
      <p style="text-align:center;">Enjoy your ${order.name} 😄</p>
    `;
  }

  modal.style.display="flex";
}

function closeModal(){
  document.getElementById("modalCard").style.display="none";
}

// order actions
function cancelOrder(idx){
  if(orders[idx] && orders[idx].status === "Pending"){
    orders[idx].status = "Cancelled";
    saveOrders(orders);
    renderOrders();
    closeModal();
  }
}
function deleteOrder(idx){
  if(orders[idx] && orders[idx].status === "Cancelled"){
    orders.splice(idx,1);
    saveOrders(orders);
    renderOrders();
    closeModal();
  }
}
</script>

</body>
</html>
