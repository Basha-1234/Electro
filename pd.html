<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Electro - Products</title>

<style>
body{
margin:0;
font-family:Poppins, sans-serif;
background:#f5f5f5;
}

/* theme variables */
:root{
  --primary-color:#ff6600;
  --secondary-color:#ff8800;
  --bg-light:#f5f5f5;
  --text-dark:#333;
  --btn-bg:#000;
  --btn-text:#fff;
}

/* apply theme */
header, nav{background:var(--secondary-color);} 
.logo{color:var(--primary-color);} 
.buy-btn{background:var(--btn-bg);color:var(--btn-text);} 
.add-btn, .call-btn{background:var(--primary-color);} 
.search button{background:var(--secondary-color);} 

.modal-content{border:2px solid var(--primary-color);} 
.close-btn{color:var(--primary-color);} 

/* HEADER */
header{
display:flex;
align-items:center;
justify-content:space-between;
padding:15px 5%;
background:white;
flex-wrap:wrap;
gap:15px;
}

.logo{
font-size:28px;
font-weight:700;
color:#ff6600;
}

.search{
flex:1;
display:flex;
max-width:600px;
border:1px solid #ddd;
border-radius:30px;
overflow:hidden;
background:white;
}

.search input{
flex:1;
padding:10px;
border:none;
outline:none;
}

.search button{
background:#ff8800;
border:none;
padding:10px 20px;
color:white;
cursor:pointer;
}

.icons{
display:flex;
align-items:center;
gap:20px;
font-size:18px;
}

.cart{
position:relative;
cursor:pointer;
}

.cart-count{
position:absolute;
top:-8px;
right:-10px;
background:red;
color:white;
border-radius:50%;
font-size:12px;
padding:2px 6px;
display:none;
}

/* PROFILE DROPDOWN */
.profile{position:relative; cursor:pointer;}
.profile-dropdown{
  display:none;
  position:absolute;
  right:0;
  top:30px;
  background:white;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
  border-radius:6px;
  min-width:140px;
  overflow:hidden;
  z-index:1000;
}
.profile-dropdown a{display:block; padding:10px; color:#333; text-decoration:none;}
.profile-dropdown a:hover{background:#f5f5f5;}

nav{
display:flex;
align-items:center;
justify-content:space-between;
background:#ff8800;
padding:10px 5%;
}

#menu{
display:flex;
align-items:center;
gap:25px;
list-style:none;
margin:0;
padding:0;
}

#menu li a{
text-decoration:none;
color:black;
font-weight:600;
}

#menu li a:hover{
color:#ffffff;
}

.call-btn{
background:#ff6600;
border:none;
padding:8px 18px;
color:white;
border-radius:20px;
cursor:pointer;
}

#showUser{
color:black;
font-weight:600;
}

/* PRODUCTS */
#productList{
max-width:1000px;
margin:40px auto;
padding:0 20px;
}

.product-card{
display:flex;
align-items:center;
justify-content:space-between;
background:white;
margin-bottom:20px;
padding:15px;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.product-left{
display:flex;
align-items:center;
gap:15px;
}

.product-left img{
width:120px;
height:120px;
object-fit:cover;
border-radius:10px;
}

.price{
font-weight:bold;
color:#ff6600;
}

.product-actions{
display:flex;
flex-direction:column;
gap:8px;
}

.buy-btn{
padding:8px 16px;
background:black;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

.add-btn{
padding:8px 16px;
background:#ff6600;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

.help-modal{
  position:fixed;
  top:0; left:0; right:0; bottom:0;
  background:rgba(0,0,0,0.6);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:10000;
}
.help-content{
  background:white;
  padding:20px;
  max-width:400px;
  width:80%;
  border-radius:8px;
  text-align:center;
  position:relative;
}
.help-content .close-btn{
  position:absolute;
  top:10px; right:15px;
  font-size:24px;
  cursor:pointer;
}
</style>
</head>

<body>

<header>
<div class="logo">👜 Electro</div>
<div class="search">
<input type="text" id="searchInput" placeholder="Search products">
<button onclick="searchProduct()">🔍</button>
</div>

<div class="icons">
  <div class="cart" onclick="goCart()">
    🛒
    <span id="cartCount" class="cart-count"></span>
  </div>
  <div class="profile">
    <span onclick="toggleDropdown()">👤</span>
    <div class="profile-dropdown" id="profileDropdown">
      <a id="welcomeUser"></a>
      <a href="profile.html">My Profile</a>
      <a href="#" onclick="logout()">Logout</a>
    </div>
  </div>
</div>
</header>

<nav>
<div><span id="showUser"></span></div>
<ul id="menu">
<li><a href="home.html">Home</a></li>
<li><a href="offers.html">Offers</a></li>
<li><a href="pd.html">Products</a></li>
<li><a href="orders.html">My Orders</a></li>    <li><a href="#" onclick="openHelp()">Help/Contact</a></li><li><button class="call-btn">+0123 456 7890</button></li>
</ul>
</nav>

<div id="productList"><h2>Available Products</h2></div>

<!-- PRODUCT DETAIL MODAL -->


<script>
/* currency conversion: dollars to rupees (approximate) */
const USD_TO_INR = 82; // adjust rate as needed

/* PRODUCTS DATA */
let products = [

  {name:"MacBook Air", price:1499, img:"l2.jpeg", category:"laptop", brand:"Apple", details:"M2 chip, 13-inch"},
  {name:"Dell XPS 15", price:1899, img:"l3.jpeg", category:"laptop", brand:"Dell", details:"Intel i7, 15-inch"},
  {name:"Dell Inspiron 16", price:1299, img:"l4.jpeg", category:"laptop", brand:"Dell", details:"Intel i5, 16-inch"},
  {name:"HP Spectre x360", price:1599, img:"l5.jpeg", category:"laptop", brand:"HP", details:"Convertible touch"},
  {name:"HP Envy 15", price:1399, img:"l6.jpeg", category:"laptop", brand:"HP", details:"Dedicated GPU"},
  {name:"Lenovo ThinkPad X1", price:1799, img:"l7.jpeg", category:"laptop", brand:"Lenovo", details:"Business class"},
  {name:"Lenovo IdeaPad 5", price:1099, img:"l8.jpeg", category:"laptop", brand:"Lenovo", details:"Budget friendly"},
  {name:"ASUS ROG Zephyrus", price:2199, img:"l9.jpeg", category:"laptop", brand:"ASUS", details:"Gaming powerhouse"},
  {name:"ASUS ZenBook 14", price:1899, img:"l10.jpeg", category:"laptop", brand:"ASUS", details:"Slim design"},

  {name:"iPhone 15 Pro", price:999, img:"p1.jpeg", category:"mobile", brand:"Apple", details:"A17 chip, Pro cameras"},
  {name:"iPhone 15", price:899, img:"p2.jpeg", category:"mobile", brand:"Apple", details:"A16 chip"},
  {name:"Samsung Galaxy S24", price:899, img:"p3.jpeg", category:"mobile", brand:"Samsung", details:"Snapdragon 8 Gen 3"},
  {name:"Samsung Galaxy S24+", price:999, img:"p4.jpeg", category:"mobile", brand:"Samsung", details:"6.7-inch display"},

  {name:"Apple Watch Series 9", price:399, img:"sw1.jpeg", category:"watch", brand:"Apple", details:"Always on display"},
  {name:"Apple Watch SE", price:249, img:"sw2.jpeg", category:"watch", brand:"Apple", details:"Affordable"},
  {name:"Samsung Galaxy Watch 6", price:349, img:"sw3.jpeg", category:"watch", brand:"Samsung", details:"BioActive sensor"},
  {name:"Samsung Galaxy Watch 5", price:299, img:"sw4.jpeg", category:"watch", brand:"Samsung", details:"Durable"},
  {name:"Fitbit Versa 4", price:229, img:"sw5.jpeg", category:"watch", brand:"Fitbit", details:"Fitness focussed"},
  {name:"Fitbit Sense 2", price:299, img:"sw6.jpeg", category:"watch", brand:"Fitbit", details:"Health features"},

  {name:"AirPods Pro 2", price:249, img:"g1.jpeg", category:"gadget", brand:"Apple", details:"Noise cancellation"},
  {name:"Magic Keyboard", price:99, img:"g2.jpeg", category:"gadget", brand:"Apple", details:"Wireless"},
  {name:"Apple Pencil 2", price:129, img:"g3.jpeg", category:"gadget", brand:"Apple", details:"Stylus"},
  {name:"Logitech MX Master 3 Mouse", price:99, img:"g4.jpeg", category:"gadget", brand:"Logitech", details:"Ergonomic"},
  {name:"Logitech K380 Keyboard", price:49, img:"g5.jpeg", category:"gadget", brand:"Logitech", details:"Compact"},
  {name:"Sony WF-1000XM5", price:299, img:"g6.jpeg", category:"gadget", brand:"Sony", details:"Hi-res audio"},
  {name:"Sony SRS-XB43 Speaker", price:199, img:"g7.jpeg", category:"gadget", brand:"Sony", details:"Extra bass"},
  {name:"Samsung Galaxy Buds2 Pro", price:229, img:"G62.jpeg", category:"gadget", brand:"Samsung", details:"3D audio"},
  {name:"Samsung SmartTag+", price:29, img:"g9.jpeg", category:"gadget", brand:"Samsung", details:"Tracking"},
  {name:"Samsung Wireless Charger Duo", price:59, img:"g10.jpeg", category:"gadget", brand:"Samsung", details:"Fast charge"}
];

let list = document.getElementById("productList");

/* DISPLAY PRODUCTS */
function displayProducts(items){
  list.innerHTML = "<h2>Available Products</h2>";
  if(items.length === 0){
    list.innerHTML += "<p>No products found.</p>";
    return;
  }
  items.forEach(p=>{
    const inrPrice = (p.price * USD_TO_INR).toFixed(2);
    list.innerHTML += `
    <div class="product-card">
      <div class="product-left">
        <img src="${p.img}">
        <div>
          <h3>${p.name}</h3>
          <div class="price">₹${inrPrice}</div>
        </div>
      </div>
      <div class="product-actions">
        <button class="buy-btn" onclick="goBuy('${p.name}','${p.category}')">Buy Now</button>
        <button class="add-btn" onclick="addToCart('${p.name}')">Add to Cart</button>
      </div>
    </div>
    `;
  });
}

/* CART */
function getCart(){
  let cart = localStorage.getItem("cart");
  if(!cart) return [];
  try{
    cart = JSON.parse(cart);
    if(!Array.isArray(cart)) return [];
    return cart;
  }catch(e){ return []; }
}

function updateCart(){
  // count total quantity in cart (simple number map)
  let cartObj = JSON.parse(localStorage.getItem("cart")) || {};
  // normalize any object entries (from old versions)
  for(let k in cartObj){
    if(typeof cartObj[k] === 'object' && cartObj[k] !== null){
      cartObj[k] = cartObj[k].qty || 1;
    }
  }
  let total = Object.values(cartObj).reduce((sum,v)=>sum + (typeof v === 'number' ? v : 0), 0);
  let badge = document.getElementById("cartCount");
  if(total>0){
    badge.innerText = total;
    badge.style.display="inline-block";
  } else badge.style.display="none";
  // store normalized cart back
  localStorage.setItem("cart", JSON.stringify(cartObj));
}
function addToCart(name){
  let product = products.find(p=>p.name===name);
  if(!product) return;
  let cartObj = JSON.parse(localStorage.getItem("cart")) || {};
  if(cartObj[name]){
    cartObj[name]++;
  } else {
    cartObj[name] = 1;
  }
  localStorage.setItem("cart", JSON.stringify(cartObj));
  updateCart();
}
function goCart(){ window.location="cart.html"; }

// HELP modal handlers
function openHelp(){document.getElementById('helpModal').style.display='flex';}
function closeHelp(){document.getElementById('helpModal').style.display='none';}
document.addEventListener('click', e=>{ if(e.target.id==='helpModal') closeHelp(); });

// navigate to buy page with product name and category
function goBuy(name, category){
  window.location = `buy.html?name=${encodeURIComponent(name)}&category=${encodeURIComponent(category)}`;
}
updateCart();

/* USER */
let storedUser = localStorage.getItem("userName");
let isLoggedIn = localStorage.getItem("isLoggedIn")==="true";
// prefix with greeting similar to home page
document.getElementById("showUser").innerText = isLoggedIn && storedUser ? "Hi, "+storedUser : "Guest";
document.getElementById("welcomeUser").innerText = isLoggedIn && storedUser ? "Welcome, "+storedUser : "";

function logout(){
  localStorage.removeItem("isLoggedIn");
  localStorage.removeItem("userName");
  window.location.href="login.html";
}

function toggleDropdown(){
  let d=document.getElementById("profileDropdown");
  d.style.display = d.style.display==="block" ? "none" : "block";
}
window.addEventListener("click", e=>{
  if(!e.target.closest(".profile")) document.getElementById("profileDropdown").style.display="none";
});

/* SEARCH FUNCTION */
function searchProduct(){
  let keyword = document.getElementById("searchInput").value.trim().toLowerCase();
  if(keyword !== ""){
    window.location.href = "pd.html?search=" + encodeURIComponent(keyword);
  }
}

/* GET URL PARAMETER */
function getSearchParam(){
  const params = new URLSearchParams(window.location.search);
  return params.get("search") ? params.get("search").toLowerCase() : "";
}

/* NORMALIZE PLURALS */
function normalizeKeyword(word){
  const map = {
    'laptops':'laptop',
    'mobiles':'mobile',
    'phones':'mobile',
    'watches':'watch',
    'earbuds':'gadgets',
    'headphones':'gadgets',
    'mice':'gadgets',
    'keyboards':'gadgets'
  };
  return map[word] || word;
}

/* FILTER PRODUCTS BASED ON SEARCH */
function filterProducts(){
  let keyword = getSearchParam();
  if(!keyword){ displayProducts(products); return; }
  keyword = normalizeKeyword(keyword);

  const filtered = products.filter(p=>{
    const name = p.name.toLowerCase();
    const cat = p.category.toLowerCase();
    return name.includes(keyword) || cat.includes(keyword);
  });

  displayProducts(filtered);

  document.getElementById("searchInput").value = keyword;
}

/* Trigger search on Enter in pd.html search bar */
document.getElementById("searchInput").addEventListener("keydown", function(e){
  if(e.key==="Enter"){ searchProduct(); }
});

/* ORDERS STORAGE */
function getOrders(){
  let ord = localStorage.getItem("orders");
  if(!ord) return [];
  try{ ord = JSON.parse(ord); if(!Array.isArray(ord)) return []; return ord; }catch(e){ return []; }
}
function saveOrders(arr){ localStorage.setItem("orders", JSON.stringify(arr)); }


function placeOrder(name){
  let product = products.find(p=>p.name===name);
  if(!product) return;
  let orders = getOrders();
  const priceInr = product.price * USD_TO_INR;
  orders.push({name:product.name, price:priceInr, img:product.img, status:"Pending", details:product.details || ''});
  saveOrders(orders);
  alert('Order placed successfully!');
  closeProductModal();
}

/* INIT */
filterProducts();

</script>
