body{background:#f5f5f5;}
/* HEADER */
header{display:flex; align-items:center; justify-content:space-between; padding:15px 5%; background:white; flex-wrap:wrap; gap:15px;}

.icons{display:flex; align-items:center; gap:20px; font-size:18px;}
.cart{position:relative; cursor:pointer;}
.cart-count{position:absolute; top:-8px; right:-10px; background:red; color:white; border-radius:60%; font-size:12px; padding:2px 6px; display:none;}
/* PROFILE DROPDOWN */

.profile-dropdown{
  display:none;

  right:0;
  top:30px;
  background:white;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
  border-radius:6px;
  min-width:140px;
  overflow:hidden;
  z-index:1000;
}
.profile-dropdown a{display:block; padding:10px; color:#333; text-decoration:none;}
.profile-dropdown a:hover{background:#f5f5f5;}
/* NAVBAR */
nav{display:flex; align-items:center; justify-content:space-between; background:#ff8800; padding:10px 5%;}
#menu{display:flex; align-items:center; gap:25px; list-style:none;}
#menu li a{text-decoration:none; color:black; font-weight:600;}
#menu li a:hover{color:#fff;}
.call-btn{background:#ff6600; border:none; padding:8px 18px; color:white; border-radius:20px; cursor:pointer;}
#showUser{color:black; font-weight:600;}
/* CATEGORY CARDS */
.products{padding:50px 5%; display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:25px;}
.product-card{background:#fff; border-radius:10px; padding:20px; text-align:center; transition:0.3s;}
.product-card:hover{transform:translateY(-5px); box-shadow:0 10px 20px rgba(0,0,0,0.1);}
.product-card img{width:100%; height:180px; object-fit:cover;}
.product-card button{background:#ff8c00; color:#fff; border:none; padding:10px 20px; border-radius:20px; cursor:pointer; margin-top:10px;}
.product-card button:hover{background:#e67300;}
/* PRODUCTS DISPLAY */
#categoryProducts{padding:40px 5%; display:none; grid-template-columns:repeat(2,1fr); gap:25px;}
.category-item{display:flex; gap:20px; background:#fff; padding:20px; border-radius:12px; align-items:center; box-shadow:0 5px 15px rgba(0,0,0,0.08); transition:0.3s;}
.category-item:hover{transform:translateY(-4px);}
.category-item img{width:120px; height:120px; object-fit:cover; border-radius:10px;}
.product-info{flex:1;}
.price{color:#ff6600; font-weight:600; margin:8px 0;}
.product-buttons{display:flex; flex-direction:column; gap:12px; width:150px;}
.product-buttons button:first-child{background:black; color:white; border:none; padding:10px; border-radius:25px; cursor:pointer; font-weight:600;}
.product-buttons button:first-child:hover{background:#333;}
.product-buttons button:last-child{background:#ff8c00; color:white; border:none; padding:10px; border-radius:25px; cursor:pointer; font-weight:600;}
.product-buttons button:last-child:hover{background:#e67300;}
/* FOOTER */
.footer{background:#222; color:#fff; padding:30px 5%; text-align:center; margin-top:40px;}
.help-modal{
  position:fixed;
  top:0; left:0; right:0; bottom:0;
  background:rgba(0,0,0,0.6);
  display:none;
  align-items:center;
  justify-content:center;

.help-content{

  width:80%;

  text-align:center;
  position:relative;

.help-content .close-btn{

  top:10px; right:15px;
  font-size:24px;

<script>
// ===== USER SESSION =====
let storedUser = localStorage.getItem("userName");
let isLoggedIn = localStorage.getItem("isLoggedIn") === "true";
document.getElementById("showUser").innerText = isLoggedIn && storedUser ? storedUser : " Hii Guest";
document.getElementById("welcomeUser").innerText = isLoggedIn && storedUser ? "Welcome, "+storedUser : "";

function loadUser(){
  let userName = localStorage.getItem("userName");
  document.getElementById("showUser").innerText = userName ? "Hi, "+userName : "";
  document.getElementById("welcomeUser").innerText = userName ? "Hi, "+userName : "";
}

function logout(){
  localStorage.removeItem("isLoggedIn");
  localStorage.removeItem("userName");
  window.location.href="login.html";
}

function toggleDropdown(){
  let d=document.getElementById("profileDropdown");
  d.style.display = d.style.display === "block" ? "none" : "block";
}
window.addEventListener("click", e=>{
  if(!e.target.closest(".profile")) document.getElementById("profileDropdown").style.display="none";
});

// ===== CART SYSTEM =====
// cart represented as { productName: quantity }
function getCart(){
  let c = localStorage.getItem("cart");
  if(!c) return {};
  try{
    let parsed = JSON.parse(c);
    if(Array.isArray(parsed)){
      // convert old array format into object map
      let obj = {};
      parsed.forEach(n => { obj[n] = (obj[n]||0) + 1; });
      localStorage.setItem("cart", JSON.stringify(obj));
      return obj;
    }
    if(typeof parsed === 'object' && parsed !== null) return parsed;
  }catch(e){ }
  return {};
}

const USD_TO_INR = 82; // rate used for display

function updateCart(){
  let cart = getCart();
  let total = Object.values(cart).reduce((s,v)=>s + (typeof v==='number'?v:0),0);
  let badge = document.getElementById("cartCount");
  if(total>0){ badge.innerText=total; badge.style.display="inline-block"; }
  else badge.style.display="none";
  localStorage.setItem("cart", JSON.stringify(cart));
}
function addToCart(productName){
  let cart=getCart();
  cart[productName] = (cart[productName]||0)+1;
  localStorage.setItem("cart",JSON.stringify(cart));
  updateCart();
}
function goCart(){ window.location="cart.html";}
function goBuy(name, category){
  window.location = `buy.html?name=${encodeURIComponent(name)}&category=${encodeURIComponent(category)}`;
}
updateCart();

// ===== DISPLAY PRODUCTS =====
let currentSearch = "";
function displayProducts(items){
  let container=document.getElementById("categoryProducts");
  container.innerHTML="";
  container.style.display="grid";
  container.style.gridTemplateColumns="repeat(2,1fr)";
  container.style.gap="25px";
  items.forEach(p=>{
    container.innerHTML+=`
    <div class="category-item">
      <img src="${p.img}" alt="${p.name}">
      <div class="product-info">
        <h3>${p.name}</h3>
        <div class="price">₹${(p.price * USD_TO_INR).toFixed(2)}</div>
      </div>
      <div class="product-buttons">
        <button onclick="goBuy('${p.name}','${p.category}')">Buy Now</button>
        <button onclick="addToCart('${p.name}')">Add To Cart</button>
      </div>
    </div>`;
  });
}

// ===== CATEGORY FILTER AFTER SEARCH =====
function showCategory(category){
  let filtered=products.filter(p=>p.category===category);
  if(currentSearch){
    filtered=filtered.filter(p=>p.name.toLowerCase().includes(currentSearch));
  }
  displayProducts(filtered);
}

// ===== SEARCH FUNCTION =====
function searchProduct(){
  let keyword=document.getElementById("searchInput").value.toLowerCase();
  currentSearch=keyword;
  let filtered=products.filter(p=>{
    let name=p.name.toLowerCase();
    // plural support
    if(keyword.endsWith("s")) keyword=keyword.slice(0,-1);
    return name.includes(keyword);
  });
  displayProducts(filtered);
}

// Trigger search on Enter
document.getElementById("searchInput").addEventListener("keydown", function(e){
  if(e.key==="Enter") searchProduct();
});

document.addEventListener('click',e=>{if(e.target.id==='helpModal')closeHelp();});

</script>
